<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sherwood lab</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090a; color: #cfd6d2; font: 13px/1.4 ui-sans-serif, system-ui, sans-serif; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; }
  .bar { position: fixed; left: 16px; right: 16px; bottom: 16px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .bar button { font: 500 12px ui-sans-serif, system-ui, sans-serif; color: #cfd6d2; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); border-radius: 99px; padding: 6px 12px; cursor: pointer; }
  .bar button:hover, .bar button[aria-pressed="true"] { border-color: #f3c160; color: #fff; }
  .note { position: fixed; left: 16px; top: 12px; color: #7d8a84; font-size: 12px; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="note" id="note">Sherwood lab (dev only)</div>
<div class="bar" id="bar"></div>
<script type="module" src="/src/sherwood-lab.ts"></script>
</body>
</html>
